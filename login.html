<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="LoginDesign.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    
    <div class="box">
        <h1>BloodSync</h1>

        <!--USERNAME-->
        <div class="username">    

            <input type="text" name="" id="input" required>
            <label for="input">Username:</label>
            <span class="underline"></span>

        </div>    
            
        <br><br>
        

        <!--PASSWORD-->
        <div class="password">
    
            <input type="password" name="" id="input" required>
            <label for="input">Password:</label>
            <span class="underline"></span>

        </div>

        <Br></Br>
        

        <!--LOGIN BUTTON-->
        <div>
            <button class="login-btn">LOGIN</button>
        </div>

        <p class="Reg">Register Using</p>

        <!--ICON-->
        <div class="socialIcon">
            <button class="icon1">
                <img src="icon/email.png" alt="Email">
            </button>
            
            <button class="icon2">
                <img src="icon/fb.png" alt="Facebook">
            </button>
        </div>

        <!--REGISTER BUTTON-->
        <br></br>
        
        <div>
            <button class="Register">Register / Sign Up</button>
        </div>
        
        <!--FORGOT PASSWORD-->
        <div>
            <button class="forgotpass">Forgot Password?</button>
        </div>
    
    </div>


</body>
</html>
